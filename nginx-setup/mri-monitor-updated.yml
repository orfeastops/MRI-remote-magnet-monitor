# Updated Cloudflare Tunnel config
# Routes monitor.example.com through Nginx (port 80/443)
# Nginx then proxies /ws + /api/v2/ → port 3002, everything else → port 3001
#
# Copy to: /home/linux/.cloudflared/mri-monitor.yml
# Then restart: pm2 restart mri-cloudflare

tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: /home/linux/.cloudflared/REPLACE_WITH_TUNNEL_ID.json
protocol: http2

ingress:
  - hostname: monitor.example.com
    service: https://localhost:443
    originRequest:
      noTLSVerify: false
  - service: http_status:404
